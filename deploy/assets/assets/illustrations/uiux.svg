<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A2E"/>
      <stop offset="100%" style="stop-color:#252545"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="400" height="200" fill="url(#bg)"/>
  <circle cx="200" cy="90" r="80" fill="#A78BFA" opacity="0.06" filter="url(#blur)"/>

  <!-- Monitor / design canvas frame -->
  <rect x="50" y="25" width="300" height="145" rx="8" fill="#1E1E3A" stroke="#6C63FF" stroke-width="1.5"/>
  <!-- Monitor stand -->
  <rect x="185" y="170" width="30" height="10" rx="2" fill="#252545"/>
  <rect x="170" y="178" width="60" height="6" rx="3" fill="#252545"/>

  <!-- Toolbar strip (top) -->
  <rect x="50" y="25" width="300" height="20" rx="8" fill="#252545"/>
  <rect x="50" y="37" width="300" height="8" fill="#252545"/>
  <!-- Toolbar buttons -->
  <circle cx="66" cy="35" r="4" fill="#FF5F57"/>
  <circle cx="80" cy="35" r="4" fill="#FEBC2E"/>
  <circle cx="94" cy="35" r="4" fill="#28C840"/>
  <!-- Toolbar tool icons -->
  <rect x="280" y="29" width="12" height="12" rx="2" fill="#6C63FF" opacity="0.6"/>
  <rect x="298" y="29" width="12" height="12" rx="2" fill="#4FC3F7" opacity="0.6"/>
  <rect x="316" y="29" width="12" height="12" rx="2" fill="#A78BFA" opacity="0.6"/>

  <!-- Left sidebar (layers panel) -->
  <rect x="55" y="50" width="48" height="113" rx="4" fill="#252545" opacity="0.7"/>
  <rect x="60" y="57" width="38" height="8" rx="2" fill="#6C63FF" opacity="0.5"/>
  <rect x="60" y="70" width="38" height="6" rx="2" fill="#ffffff" opacity="0.15"/>
  <rect x="60" y="81" width="38" height="6" rx="2" fill="#ffffff" opacity="0.12"/>
  <rect x="60" y="92" width="28" height="6" rx="2" fill="#4FC3F7" opacity="0.4"/>
  <rect x="60" y="103" width="38" height="6" rx="2" fill="#ffffff" opacity="0.12"/>
  <rect x="60" y="114" width="30" height="6" rx="2" fill="#ffffff" opacity="0.10"/>
  <rect x="60" y="125" width="38" height="6" rx="2" fill="#A78BFA" opacity="0.4"/>
  <rect x="60" y="136" width="22" height="6" rx="2" fill="#ffffff" opacity="0.10"/>

  <!-- Main canvas: wireframe / UI layout -->
  <rect x="110" y="50" width="230" height="113" rx="4" fill="#0D0D1A"/>
  <!-- Wireframe header bar -->
  <rect x="115" y="55" width="220" height="18" rx="3" fill="#252545"/>
  <rect x="120" y="60" width="80" height="8" rx="2" fill="#6C63FF" opacity="0.5"/>
  <rect x="290" y="60" width="40" height="8" rx="2" fill="#4FC3F7" opacity="0.4"/>

  <!-- Wireframe hero block -->
  <rect x="115" y="78" width="140" height="52" rx="3" fill="#1E1E3A" stroke="#6C63FF" stroke-width="1" opacity="0.7"/>
  <!-- Image placeholder X -->
  <line x1="115" y1="78" x2="255" y2="130" stroke="#6C63FF" stroke-width="0.8" opacity="0.3"/>
  <line x1="255" y1="78" x2="115" y2="130" stroke="#6C63FF" stroke-width="0.8" opacity="0.3"/>

  <!-- Wireframe sidebar right -->
  <rect x="262" y="78" width="63" height="24" rx="3" fill="#1E1E3A" stroke="#A78BFA" stroke-width="1" opacity="0.7"/>
  <rect x="267" y="83" width="50" height="5" rx="2" fill="#A78BFA" opacity="0.4"/>
  <rect x="267" y="92" width="35" height="5" rx="2" fill="#ffffff" opacity="0.15"/>
  <rect x="262" y="107" width="63" height="21" rx="3" fill="#1E1E3A" stroke="#4FC3F7" stroke-width="1" opacity="0.7"/>
  <rect x="267" y="112" width="45" height="5" rx="2" fill="#4FC3F7" opacity="0.4"/>
  <rect x="267" y="121" width="30" height="5" rx="2" fill="#ffffff" opacity="0.15"/>

  <!-- Wireframe text lines bottom -->
  <rect x="115" y="135" width="210" height="5" rx="2" fill="#ffffff" opacity="0.15"/>
  <rect x="115" y="144" width="160" height="5" rx="2" fill="#ffffff" opacity="0.1"/>
  <rect x="115" y="153" width="80" height="14" rx="3" fill="#6C63FF" opacity="0.6"/>

  <!-- Cursor hint -->
  <polygon points="295,140 295,158 299,154 303,162 306,161 302,153 307,151" fill="#ffffff" opacity="0.8"/>

  <text x="200" y="195" text-anchor="middle" fill="#6C63FF" font-size="11" font-family="sans-serif" font-weight="bold" opacity="0.9">UI/UX DESIGN</text>
</svg>
