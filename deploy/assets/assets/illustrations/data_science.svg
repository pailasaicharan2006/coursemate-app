<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A2E"/>
      <stop offset="100%" style="stop-color:#252545"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6C63FF"/>
      <stop offset="100%" style="stop-color:#4a3fbf"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4FC3F7"/>
      <stop offset="100%" style="stop-color:#0288d1"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#A78BFA"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="400" height="200" fill="url(#bg)"/>
  <circle cx="200" cy="100" r="90" fill="#6C63FF" opacity="0.06" filter="url(#blur)"/>

  <!-- Grid lines -->
  <line x1="50" y1="30" x2="50" y2="160" stroke="#ffffff" stroke-width="1" opacity="0.15"/>
  <line x1="50" y1="160" x2="370" y2="160" stroke="#ffffff" stroke-width="1" opacity="0.15"/>
  <line x1="50" y1="120" x2="370" y2="120" stroke="#ffffff" stroke-width="0.5" opacity="0.08" stroke-dasharray="4,4"/>
  <line x1="50" y1="80" x2="370" y2="80" stroke="#ffffff" stroke-width="0.5" opacity="0.08" stroke-dasharray="4,4"/>
  <line x1="50" y1="40" x2="370" y2="40" stroke="#ffffff" stroke-width="0.5" opacity="0.08" stroke-dasharray="4,4"/>

  <!-- Bar chart bars -->
  <rect x="75"  y="100" width="30" height="60" rx="3" fill="url(#bar1)" opacity="0.9"/>
  <rect x="120" y="70"  width="30" height="90" rx="3" fill="url(#bar2)" opacity="0.9"/>
  <rect x="165" y="50"  width="30" height="110" rx="3" fill="url(#bar1)" opacity="0.9"/>
  <rect x="210" y="85"  width="30" height="75" rx="3" fill="url(#bar3)" opacity="0.9"/>
  <rect x="255" y="60"  width="30" height="100" rx="3" fill="url(#bar2)" opacity="0.9"/>
  <rect x="300" y="40"  width="30" height="120" rx="3" fill="url(#bar1)" opacity="0.9"/>

  <!-- Trend line over bars -->
  <polyline points="90,95 135,65 180,45 225,80 270,55 315,35"
    fill="none" stroke="#F59E0B" stroke-width="2" opacity="0.8" stroke-dasharray="none"/>
  <!-- Trend dots -->
  <circle cx="90"  cy="95" r="4" fill="#F59E0B" opacity="0.9"/>
  <circle cx="135" cy="65" r="4" fill="#F59E0B" opacity="0.9"/>
  <circle cx="180" cy="45" r="4" fill="#F59E0B" opacity="0.9"/>
  <circle cx="225" cy="80" r="4" fill="#F59E0B" opacity="0.9"/>
  <circle cx="270" cy="55" r="4" fill="#F59E0B" opacity="0.9"/>
  <circle cx="315" cy="35" r="4" fill="#F59E0B" opacity="0.9"/>

  <!-- Pie chart hint (right side) -->
  <circle cx="355" cy="90" r="25" fill="none" stroke="#6C63FF" stroke-width="2" opacity="0.3"/>
  <path d="M355,90 L355,65 A25,25 0 0,1 377,103 Z" fill="#6C63FF" opacity="0.5"/>
  <path d="M355,90 L377,103 A25,25 0 0,1 333,103 Z" fill="#4FC3F7" opacity="0.5"/>
  <path d="M355,90 L333,103 A25,25 0 0,1 355,65 Z" fill="#A78BFA" opacity="0.5"/>

  <text x="200" y="192" text-anchor="middle" fill="#6C63FF" font-size="11" font-family="sans-serif" font-weight="bold" opacity="0.9">DATA SCIENCE</text>
</svg>
