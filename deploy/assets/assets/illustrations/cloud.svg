<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A2E"/>
      <stop offset="100%" style="stop-color:#252545"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C63FF;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#4FC3F7;stop-opacity:0.9"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <rect width="400" height="200" fill="url(#bg)"/>
  <ellipse cx="200" cy="85" rx="110" ry="50" fill="#6C63FF" opacity="0.06" filter="url(#blur)"/>

  <!-- Main cloud shape -->
  <ellipse cx="200" cy="80" rx="90" ry="38" fill="#252545" stroke="#6C63FF" stroke-width="1.5"/>
  <ellipse cx="155" cy="88" rx="38" ry="30" fill="#252545" stroke="#6C63FF" stroke-width="1.5"/>
  <ellipse cx="245" cy="88" rx="38" ry="30" fill="#252545" stroke="#6C63FF" stroke-width="1.5"/>
  <ellipse cx="200" cy="75" rx="55" ry="38" fill="#252545" stroke="#6C63FF" stroke-width="1.5"/>
  <!-- Cloud inner glow -->
  <ellipse cx="200" cy="80" rx="80" ry="30" fill="#6C63FF" opacity="0.08"/>

  <!-- Cloud icon center -->
  <text x="200" y="88" text-anchor="middle" fill="#6C63FF" font-size="22" font-family="sans-serif" opacity="0.7">☁</text>

  <!-- Server rack / boxes below -->
  <rect x="60"  y="135" width="60" height="35" rx="5" fill="#1E1E3A" stroke="#6C63FF" stroke-width="1" opacity="0.9"/>
  <rect x="65"  y="140" width="50" height="6" rx="2" fill="#6C63FF" opacity="0.4"/>
  <rect x="65"  y="150" width="50" height="6" rx="2" fill="#4FC3F7" opacity="0.4"/>
  <rect x="65"  y="160" width="50" height="6" rx="2" fill="#6C63FF" opacity="0.4"/>

  <rect x="170" y="135" width="60" height="35" rx="5" fill="#1E1E3A" stroke="#4FC3F7" stroke-width="1" opacity="0.9"/>
  <rect x="175" y="140" width="50" height="6" rx="2" fill="#4FC3F7" opacity="0.4"/>
  <rect x="175" y="150" width="50" height="6" rx="2" fill="#6C63FF" opacity="0.4"/>
  <rect x="175" y="160" width="50" height="6" rx="2" fill="#4FC3F7" opacity="0.4"/>

  <rect x="280" y="135" width="60" height="35" rx="5" fill="#1E1E3A" stroke="#6C63FF" stroke-width="1" opacity="0.9"/>
  <rect x="285" y="140" width="50" height="6" rx="2" fill="#6C63FF" opacity="0.4"/>
  <rect x="285" y="150" width="50" height="6" rx="2" fill="#4FC3F7" opacity="0.4"/>
  <rect x="285" y="160" width="50" height="6" rx="2" fill="#6C63FF" opacity="0.4"/>

  <!-- Connecting lines from cloud to servers -->
  <line x1="165" y1="110" x2="90"  y2="135" stroke="#6C63FF" stroke-width="1" opacity="0.5" stroke-dasharray="4,3"/>
  <line x1="200" y1="112" x2="200" y2="135" stroke="#4FC3F7" stroke-width="1" opacity="0.5" stroke-dasharray="4,3"/>
  <line x1="235" y1="110" x2="310" y2="135" stroke="#6C63FF" stroke-width="1" opacity="0.5" stroke-dasharray="4,3"/>

  <text x="200" y="192" text-anchor="middle" fill="#6C63FF" font-size="11" font-family="sans-serif" font-weight="bold" opacity="0.9">CLOUD COMPUTING</text>
</svg>
