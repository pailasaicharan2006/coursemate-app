<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A2E"/>
      <stop offset="100%" style="stop-color:#252545"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="400" height="200" fill="url(#bg)"/>
  <circle cx="200" cy="95" r="75" fill="#6C63FF" opacity="0.06" filter="url(#blur)"/>

  <!-- Browser window frame -->
  <rect x="35" y="22" width="330" height="155" rx="10" fill="#1E1E3A" stroke="#6C63FF" stroke-width="1.5"/>
  <!-- Browser chrome bar -->
  <rect x="35" y="22" width="330" height="28" rx="10" fill="#252545"/>
  <rect x="35" y="38" width="330" height="12" fill="#252545"/>
  <!-- Browser dots -->
  <circle cx="54" cy="36" r="5" fill="#FF5F57"/>
  <circle cx="70" cy="36" r="5" fill="#FEBC2E"/>
  <circle cx="86" cy="36" r="5" fill="#28C840"/>
  <!-- Address bar -->
  <rect x="105" y="29" width="200" height="14" rx="7" fill="#1E1E3A"/>
  <text x="205" y="40" text-anchor="middle" fill="#6C63FF" font-size="8" font-family="monospace" opacity="0.8">https://coursemate.dev</text>
  <!-- Reload icon -->
  <text x="95" y="40" fill="#ffffff" font-size="10" font-family="sans-serif" opacity="0.4">↺</text>
  <!-- Bookmark icon -->
  <text x="313" y="40" fill="#ffffff" font-size="10" font-family="sans-serif" opacity="0.4">☆</text>
  <!-- Menu dots -->
  <circle cx="335" cy="36" r="2" fill="#ffffff" opacity="0.4"/>
  <circle cx="343" cy="36" r="2" fill="#ffffff" opacity="0.4"/>
  <circle cx="351" cy="36" r="2" fill="#ffffff" opacity="0.4"/>

  <!-- Webpage content area -->
  <!-- Nav bar on page -->
  <rect x="40" y="53" width="320" height="18" fill="#6C63FF" opacity="0.25"/>
  <rect x="45" y="57" width="45" height="8" rx="3" fill="#6C63FF" opacity="0.7"/>
  <rect x="200" y="57" width="25" height="8" rx="2" fill="#ffffff" opacity="0.2"/>
  <rect x="230" y="57" width="25" height="8" rx="2" fill="#ffffff" opacity="0.2"/>
  <rect x="260" y="57" width="25" height="8" rx="2" fill="#ffffff" opacity="0.2"/>
  <rect x="300" y="55" width="55" height="12" rx="6" fill="#6C63FF" opacity="0.8"/>

  <!-- Hero section -->
  <rect x="40" y="74" width="180" height="60" fill="#0D0D1A"/>
  <rect x="50" y="82" width="110" height="12" rx="2" fill="#6C63FF" opacity="0.6"/>
  <rect x="50" y="99" width="150" height="6" rx="2" fill="#ffffff" opacity="0.2"/>
  <rect x="50" y="110" width="130" height="6" rx="2" fill="#ffffff" opacity="0.15"/>
  <rect x="50" y="122" width="70" height="9" rx="4" fill="#6C63FF" opacity="0.8"/>

  <!-- Hero image -->
  <rect x="225" y="74" width="135" height="60" fill="#252545" opacity="0.8"/>
  <line x1="225" y1="74" x2="360" y2="134" stroke="#6C63FF" stroke-width="0.7" opacity="0.3"/>
  <line x1="360" y1="74" x2="225" y2="134" stroke="#6C63FF" stroke-width="0.7" opacity="0.3"/>
  <!-- Code brackets decoration -->
  <text x="258" y="110" fill="#4FC3F7" font-size="24" font-family="monospace" opacity="0.35">&lt;/&gt;</text>

  <!-- Cards row -->
  <rect x="40"  y="140" width="95" height="30" rx="4" fill="#252545"/>
  <rect x="45"  y="145" width="60" height="6" rx="2" fill="#6C63FF" opacity="0.5"/>
  <rect x="45"  y="155" width="80" height="4" rx="2" fill="#ffffff" opacity="0.15"/>
  <rect x="145" y="140" width="95" height="30" rx="4" fill="#252545"/>
  <rect x="150" y="145" width="60" height="6" rx="2" fill="#4FC3F7" opacity="0.5"/>
  <rect x="150" y="155" width="80" height="4" rx="2" fill="#ffffff" opacity="0.15"/>
  <rect x="250" y="140" width="110" height="30" rx="4" fill="#252545"/>
  <rect x="255" y="145" width="60" height="6" rx="2" fill="#A78BFA" opacity="0.5"/>
  <rect x="255" y="155" width="95" height="4" rx="2" fill="#ffffff" opacity="0.15"/>

  <text x="200" y="192" text-anchor="middle" fill="#6C63FF" font-size="11" font-family="sans-serif" font-weight="bold" opacity="0.9">WEB DEVELOPMENT</text>
</svg>
