<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A2E"/>
      <stop offset="100%" style="stop-color:#252545"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <rect width="400" height="200" fill="url(#bg)"/>
  <!-- Glow -->
  <circle cx="200" cy="80" r="80" fill="#6C63FF" opacity="0.07" filter="url(#blur)"/>

  <!-- Neural network (same as AI, ML-specific label) -->
  <line x1="80" y1="60" x2="170" y2="50" stroke="#6C63FF" stroke-width="1" opacity="0.4"/>
  <line x1="80" y1="60" x2="170" y2="100" stroke="#6C63FF" stroke-width="1" opacity="0.4"/>
  <line x1="80" y1="60" x2="170" y2="150" stroke="#4FC3F7" stroke-width="0.8" opacity="0.3"/>
  <line x1="80" y1="100" x2="170" y2="50" stroke="#4FC3F7" stroke-width="0.8" opacity="0.3"/>
  <line x1="80" y1="100" x2="170" y2="100" stroke="#6C63FF" stroke-width="1.5" opacity="0.6"/>
  <line x1="80" y1="100" x2="170" y2="150" stroke="#6C63FF" stroke-width="1" opacity="0.4"/>
  <line x1="80" y1="140" x2="170" y2="50" stroke="#4FC3F7" stroke-width="0.8" opacity="0.3"/>
  <line x1="80" y1="140" x2="170" y2="100" stroke="#6C63FF" stroke-width="1" opacity="0.4"/>
  <line x1="80" y1="140" x2="170" y2="150" stroke="#6C63FF" stroke-width="1" opacity="0.4"/>
  <line x1="170" y1="50" x2="260" y2="60" stroke="#6C63FF" stroke-width="1" opacity="0.4"/>
  <line x1="170" y1="50" x2="260" y2="100" stroke="#4FC3F7" stroke-width="1" opacity="0.4"/>
  <line x1="170" y1="100" x2="260" y2="60" stroke="#4FC3F7" stroke-width="1" opacity="0.4"/>
  <line x1="170" y1="100" x2="260" y2="100" stroke="#6C63FF" stroke-width="1.5" opacity="0.6"/>
  <line x1="170" y1="100" x2="260" y2="140" stroke="#6C63FF" stroke-width="1" opacity="0.4"/>
  <line x1="170" y1="150" x2="260" y2="100" stroke="#6C63FF" stroke-width="1" opacity="0.4"/>
  <line x1="170" y1="150" x2="260" y2="140" stroke="#4FC3F7" stroke-width="1" opacity="0.4"/>
  <line x1="260" y1="60" x2="330" y2="100" stroke="#6C63FF" stroke-width="1.2" opacity="0.5"/>
  <line x1="260" y1="100" x2="330" y2="100" stroke="#6C63FF" stroke-width="2" opacity="0.7"/>
  <line x1="260" y1="140" x2="330" y2="100" stroke="#4FC3F7" stroke-width="1.2" opacity="0.5"/>

  <!-- Input layer -->
  <circle cx="80" cy="60" r="9" fill="#252545" stroke="#6C63FF" stroke-width="1.5"/>
  <circle cx="80" cy="60" r="4" fill="#6C63FF" opacity="0.8"/>
  <circle cx="80" cy="100" r="9" fill="#252545" stroke="#6C63FF" stroke-width="1.5"/>
  <circle cx="80" cy="100" r="4" fill="#6C63FF"/>
  <circle cx="80" cy="140" r="9" fill="#252545" stroke="#4FC3F7" stroke-width="1.5"/>
  <circle cx="80" cy="140" r="4" fill="#4FC3F7" opacity="0.8"/>
  <!-- Hidden layer -->
  <circle cx="170" cy="50" r="9" fill="#252545" stroke="#6C63FF" stroke-width="1.5"/>
  <circle cx="170" cy="50" r="4" fill="#6C63FF" opacity="0.8"/>
  <circle cx="170" cy="100" r="11" fill="#252545" stroke="#6C63FF" stroke-width="2"/>
  <circle cx="170" cy="100" r="5" fill="#6C63FF"/>
  <circle cx="170" cy="150" r="9" fill="#252545" stroke="#4FC3F7" stroke-width="1.5"/>
  <circle cx="170" cy="150" r="4" fill="#4FC3F7" opacity="0.8"/>
  <!-- Hidden layer 2 -->
  <circle cx="260" cy="60" r="9" fill="#252545" stroke="#4FC3F7" stroke-width="1.5"/>
  <circle cx="260" cy="60" r="4" fill="#4FC3F7" opacity="0.8"/>
  <circle cx="260" cy="100" r="11" fill="#252545" stroke="#6C63FF" stroke-width="2"/>
  <circle cx="260" cy="100" r="5" fill="#6C63FF"/>
  <circle cx="260" cy="140" r="9" fill="#252545" stroke="#6C63FF" stroke-width="1.5"/>
  <circle cx="260" cy="140" r="4" fill="#6C63FF" opacity="0.8"/>
  <!-- Output node (single, emphasized) -->
  <circle cx="330" cy="100" r="14" fill="#252545" stroke="#6C63FF" stroke-width="2.5"/>
  <circle cx="330" cy="100" r="7" fill="#6C63FF"/>
  <!-- Model accuracy curve overlay -->
  <polyline points="30,170 60,165 90,155 120,140 150,120 180,100 210,82 240,70 270,62 300,58 330,56 360,55"
    fill="none" stroke="#4FC3F7" stroke-width="1.5" opacity="0.5" stroke-dasharray="4,3"/>

  <text x="200" y="192" text-anchor="middle" fill="#6C63FF" font-size="11" font-family="sans-serif" font-weight="bold" opacity="0.9">MACHINE LEARNING</text>
</svg>
