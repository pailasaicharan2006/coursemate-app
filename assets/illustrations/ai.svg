<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A2E"/>
      <stop offset="100%" style="stop-color:#252545"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C63FF;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#4FC3F7;stop-opacity:0.8"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="200" fill="url(#bg)"/>
  <!-- Glow blobs -->
  <circle cx="200" cy="100" r="70" fill="#6C63FF" opacity="0.08" filter="url(#blur)"/>
  <circle cx="320" cy="60" r="40" fill="#4FC3F7" opacity="0.07" filter="url(#blur)"/>

  <!-- Neural network connections -->
  <!-- Layer 1→2 connections -->
  <line x1="80" y1="60" x2="170" y2="50" stroke="#6C63FF" stroke-width="1" opacity="0.4"/>
  <line x1="80" y1="60" x2="170" y2="100" stroke="#6C63FF" stroke-width="1" opacity="0.4"/>
  <line x1="80" y1="60" x2="170" y2="150" stroke="#4FC3F7" stroke-width="0.8" opacity="0.3"/>
  <line x1="80" y1="100" x2="170" y2="50" stroke="#4FC3F7" stroke-width="0.8" opacity="0.3"/>
  <line x1="80" y1="100" x2="170" y2="100" stroke="#6C63FF" stroke-width="1.5" opacity="0.5"/>
  <line x1="80" y1="100" x2="170" y2="150" stroke="#6C63FF" stroke-width="1" opacity="0.4"/>
  <line x1="80" y1="140" x2="170" y2="50" stroke="#4FC3F7" stroke-width="0.8" opacity="0.3"/>
  <line x1="80" y1="140" x2="170" y2="100" stroke="#6C63FF" stroke-width="1" opacity="0.4"/>
  <line x1="80" y1="140" x2="170" y2="150" stroke="#6C63FF" stroke-width="1" opacity="0.4"/>

  <!-- Layer 2→3 connections -->
  <line x1="170" y1="50" x2="260" y2="60" stroke="#6C63FF" stroke-width="1" opacity="0.4"/>
  <line x1="170" y1="50" x2="260" y2="100" stroke="#4FC3F7" stroke-width="1" opacity="0.4"/>
  <line x1="170" y1="50" x2="260" y2="140" stroke="#6C63FF" stroke-width="0.8" opacity="0.3"/>
  <line x1="170" y1="100" x2="260" y2="60" stroke="#4FC3F7" stroke-width="1" opacity="0.4"/>
  <line x1="170" y1="100" x2="260" y2="100" stroke="#6C63FF" stroke-width="1.5" opacity="0.5"/>
  <line x1="170" y1="100" x2="260" y2="140" stroke="#6C63FF" stroke-width="1" opacity="0.4"/>
  <line x1="170" y1="150" x2="260" y2="60" stroke="#4FC3F7" stroke-width="0.8" opacity="0.3"/>
  <line x1="170" y1="150" x2="260" y2="100" stroke="#6C63FF" stroke-width="1" opacity="0.4"/>
  <line x1="170" y1="150" x2="260" y2="140" stroke="#4FC3F7" stroke-width="1" opacity="0.4"/>

  <!-- Layer 3→4 connections -->
  <line x1="260" y1="60" x2="330" y2="80" stroke="#6C63FF" stroke-width="1" opacity="0.4"/>
  <line x1="260" y1="60" x2="330" y2="120" stroke="#4FC3F7" stroke-width="0.8" opacity="0.3"/>
  <line x1="260" y1="100" x2="330" y2="80" stroke="#6C63FF" stroke-width="1.5" opacity="0.5"/>
  <line x1="260" y1="100" x2="330" y2="120" stroke="#6C63FF" stroke-width="1.5" opacity="0.5"/>
  <line x1="260" y1="140" x2="330" y2="80" stroke="#4FC3F7" stroke-width="0.8" opacity="0.3"/>
  <line x1="260" y1="140" x2="330" y2="120" stroke="#6C63FF" stroke-width="1" opacity="0.4"/>

  <!-- Input nodes (layer 1) -->
  <circle cx="80" cy="60" r="10" fill="#252545" stroke="#6C63FF" stroke-width="1.5"/>
  <circle cx="80" cy="60" r="5" fill="#6C63FF" opacity="0.7"/>
  <circle cx="80" cy="100" r="10" fill="#252545" stroke="#6C63FF" stroke-width="1.5"/>
  <circle cx="80" cy="100" r="5" fill="#6C63FF" opacity="0.9"/>
  <circle cx="80" cy="140" r="10" fill="#252545" stroke="#4FC3F7" stroke-width="1.5"/>
  <circle cx="80" cy="140" r="5" fill="#4FC3F7" opacity="0.7"/>

  <!-- Hidden layer 1 nodes (layer 2) -->
  <circle cx="170" cy="50" r="10" fill="#252545" stroke="#6C63FF" stroke-width="1.5"/>
  <circle cx="170" cy="50" r="5" fill="#6C63FF" opacity="0.8"/>
  <circle cx="170" cy="100" r="12" fill="#252545" stroke="#6C63FF" stroke-width="2"/>
  <circle cx="170" cy="100" r="6" fill="#6C63FF"/>
  <circle cx="170" cy="150" r="10" fill="#252545" stroke="#4FC3F7" stroke-width="1.5"/>
  <circle cx="170" cy="150" r="5" fill="#4FC3F7" opacity="0.8"/>

  <!-- Hidden layer 2 nodes (layer 3) -->
  <circle cx="260" cy="60" r="10" fill="#252545" stroke="#4FC3F7" stroke-width="1.5"/>
  <circle cx="260" cy="60" r="5" fill="#4FC3F7" opacity="0.8"/>
  <circle cx="260" cy="100" r="12" fill="#252545" stroke="#6C63FF" stroke-width="2"/>
  <circle cx="260" cy="100" r="6" fill="#6C63FF"/>
  <circle cx="260" cy="140" r="10" fill="#252545" stroke="#6C63FF" stroke-width="1.5"/>
  <circle cx="260" cy="140" r="5" fill="#6C63FF" opacity="0.8"/>

  <!-- Output nodes (layer 4) -->
  <circle cx="330" cy="80" r="12" fill="#252545" stroke="#6C63FF" stroke-width="2"/>
  <circle cx="330" cy="80" r="6" fill="#6C63FF"/>
  <circle cx="330" cy="120" r="12" fill="#252545" stroke="#4FC3F7" stroke-width="2"/>
  <circle cx="330" cy="120" r="6" fill="#4FC3F7"/>

  <!-- Label -->
  <text x="200" y="190" text-anchor="middle" fill="#6C63FF" font-size="11" font-family="sans-serif" font-weight="bold" opacity="0.9">ARTIFICIAL INTELLIGENCE</text>
</svg>
