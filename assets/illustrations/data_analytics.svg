<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A2E"/>
      <stop offset="100%" style="stop-color:#252545"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6C63FF"/>
      <stop offset="100%" style="stop-color:#4a3fbf"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4FC3F7"/>
      <stop offset="100%" style="stop-color:#0288d1"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="400" height="200" fill="url(#bg)"/>
  <circle cx="200" cy="100" r="80" fill="#4FC3F7" opacity="0.06" filter="url(#blur)"/>

  <!-- Axes -->
  <line x1="50" y1="25" x2="50" y2="160" stroke="#ffffff" stroke-width="1" opacity="0.2"/>
  <line x1="50" y1="160" x2="370" y2="160" stroke="#ffffff" stroke-width="1" opacity="0.2"/>
  <!-- Grid -->
  <line x1="50" y1="125" x2="370" y2="125" stroke="#ffffff" stroke-width="0.5" opacity="0.08" stroke-dasharray="4,4"/>
  <line x1="50" y1="90" x2="370" y2="90" stroke="#ffffff" stroke-width="0.5" opacity="0.08" stroke-dasharray="4,4"/>
  <line x1="50" y1="55" x2="370" y2="55" stroke="#ffffff" stroke-width="0.5" opacity="0.08" stroke-dasharray="4,4"/>

  <!-- Area chart fill -->
  <polygon points="50,160 50,130 100,110 150,80 200,95 250,60 300,75 350,40 370,45 370,160"
    fill="#6C63FF" opacity="0.18"/>
  <!-- Area chart line -->
  <polyline points="50,130 100,110 150,80 200,95 250,60 300,75 350,40 370,45"
    fill="none" stroke="#6C63FF" stroke-width="2.5" opacity="0.9"/>

  <!-- Second area -->
  <polygon points="50,160 50,150 100,140 150,135 200,140 250,120 300,130 350,110 370,115 370,160"
    fill="#4FC3F7" opacity="0.15"/>
  <polyline points="50,150 100,140 150,135 200,140 250,120 300,130 350,110 370,115"
    fill="none" stroke="#4FC3F7" stroke-width="2" opacity="0.8"/>

  <!-- Data points -->
  <circle cx="100" cy="110" r="4" fill="#6C63FF"/>
  <circle cx="150" cy="80"  r="4" fill="#6C63FF"/>
  <circle cx="200" cy="95"  r="4" fill="#6C63FF"/>
  <circle cx="250" cy="60"  r="5" fill="#6C63FF"/>
  <circle cx="300" cy="75"  r="4" fill="#6C63FF"/>
  <circle cx="350" cy="40"  r="5" fill="#6C63FF"/>

  <!-- Scatter points -->
  <circle cx="90"  cy="130" r="3" fill="#F59E0B" opacity="0.8"/>
  <circle cx="130" cy="115" r="3" fill="#F59E0B" opacity="0.8"/>
  <circle cx="175" cy="70"  r="3" fill="#F59E0B" opacity="0.8"/>
  <circle cx="220" cy="50"  r="3" fill="#F59E0B" opacity="0.8"/>
  <circle cx="270" cy="85"  r="3" fill="#F59E0B" opacity="0.8"/>
  <circle cx="320" cy="55"  r="3" fill="#F59E0B" opacity="0.8"/>
  <circle cx="360" cy="35"  r="3" fill="#F59E0B" opacity="0.8"/>

  <text x="200" y="192" text-anchor="middle" fill="#6C63FF" font-size="11" font-family="sans-serif" font-weight="bold" opacity="0.9">DATA ANALYTICS</text>
</svg>
