<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A2E"/>
      <stop offset="100%" style="stop-color:#252545"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="400" height="200" fill="url(#bg)"/>
  <circle cx="200" cy="95" r="75" fill="#4FC3F7" opacity="0.06" filter="url(#blur)"/>

  <!-- Phone frame -->
  <rect x="150" y="18" width="100" height="160" rx="14" fill="#1E1E3A" stroke="#6C63FF" stroke-width="2"/>
  <!-- Screen -->
  <rect x="157" y="33" width="86" height="130" rx="6" fill="#0D0D1A"/>
  <!-- Camera notch -->
  <rect x="190" y="24" width="20" height="6" rx="3" fill="#252545"/>
  <!-- Home button -->
  <circle cx="200" cy="172" r="5" fill="#252545" stroke="#6C63FF" stroke-width="1"/>

  <!-- App UI on screen -->
  <!-- Status bar -->
  <rect x="157" y="33" width="86" height="10" rx="2" fill="#1E1E3A"/>
  <!-- App header -->
  <rect x="157" y="43" width="86" height="16" fill="#6C63FF" opacity="0.7"/>
  <text x="200" y="55" text-anchor="middle" fill="#ffffff" font-size="7" font-family="sans-serif" font-weight="bold" opacity="0.9">CourseMate</text>

  <!-- Card 1 -->
  <rect x="162" y="64" width="76" height="30" rx="4" fill="#252545"/>
  <rect x="162" y="64" width="76" height="8" rx="4" fill="#4FC3F7" opacity="0.5"/>
  <line x1="167" y1="78" x2="230" y2="78" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
  <line x1="167" y1="85" x2="215" y2="85" stroke="#ffffff" stroke-width="1" opacity="0.2"/>

  <!-- Card 2 -->
  <rect x="162" y="100" width="76" height="30" rx="4" fill="#252545"/>
  <rect x="162" y="100" width="76" height="8" rx="4" fill="#6C63FF" opacity="0.5"/>
  <line x1="167" y1="114" x2="230" y2="114" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
  <line x1="167" y1="121" x2="210" y2="121" stroke="#ffffff" stroke-width="1" opacity="0.2"/>

  <!-- Bottom nav bar -->
  <rect x="157" y="143" width="86" height="20" rx="2" fill="#1E1E3A"/>
  <!-- Nav icons -->
  <circle cx="174" cy="153" r="4" fill="#6C63FF" opacity="0.8"/>
  <circle cx="190" cy="153" r="4" fill="#252545" stroke="#4FC3F7" stroke-width="0.8"/>
  <circle cx="206" cy="153" r="4" fill="#252545" stroke="#4FC3F7" stroke-width="0.8"/>
  <circle cx="222" cy="153" r="4" fill="#252545" stroke="#4FC3F7" stroke-width="0.8"/>

  <!-- Flutter logo hint (outside, left) -->
  <g transform="translate(70, 65) rotate(-10)">
    <polygon points="0,0 30,30 0,60" fill="#4FC3F7" opacity="0.25"/>
    <polygon points="0,30 30,60 15,60" fill="#6C63FF" opacity="0.35"/>
    <text x="35" y="20" fill="#4FC3F7" font-size="9" font-family="sans-serif" opacity="0.6">Flutter</text>
    <text x="35" y="33" fill="#4FC3F7" font-size="8" font-family="sans-serif" opacity="0.4">&amp; Dart</text>
  </g>

  <!-- React Native hint (right) -->
  <g transform="translate(285, 70)">
    <circle cx="15" cy="15" r="12" fill="none" stroke="#4FC3F7" stroke-width="1.5" opacity="0.5"/>
    <ellipse cx="15" cy="15" rx="12" ry="5" fill="none" stroke="#4FC3F7" stroke-width="1.5" opacity="0.4" transform="rotate(60,15,15)"/>
    <ellipse cx="15" cy="15" rx="12" ry="5" fill="none" stroke="#4FC3F7" stroke-width="1.5" opacity="0.4" transform="rotate(120,15,15)"/>
    <circle cx="15" cy="15" r="3" fill="#4FC3F7" opacity="0.7"/>
  </g>

  <text x="200" y="192" text-anchor="middle" fill="#6C63FF" font-size="11" font-family="sans-serif" font-weight="bold" opacity="0.9">MOBILE DEVELOPMENT</text>
</svg>
