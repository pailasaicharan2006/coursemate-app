<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A2E"/>
      <stop offset="100%" style="stop-color:#252545"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="400" height="200" fill="url(#bg)"/>
  <circle cx="200" cy="95" r="75" fill="#6C63FF" opacity="0.06" filter="url(#blur)"/>

  <!-- Terminal window -->
  <rect x="40" y="25" width="320" height="145" rx="10" fill="#0D0D1A" stroke="#6C63FF" stroke-width="1.5" opacity="0.9"/>
  <!-- Title bar -->
  <rect x="40" y="25" width="320" height="28" rx="10" fill="#1E1E3A"/>
  <rect x="40" y="39" width="320" height="14" fill="#1E1E3A"/>
  <!-- Dots -->
  <circle cx="60" cy="39" r="5" fill="#FF5F57"/>
  <circle cx="76" cy="39" r="5" fill="#FEBC2E"/>
  <circle cx="92" cy="39" r="5" fill="#28C840"/>
  <!-- Title text -->
  <text x="200" y="44" text-anchor="middle" fill="#ffffff" font-size="11" font-family="monospace" opacity="0.6">terminal</text>

  <!-- Code lines -->
  <!-- Line 1: prompt + import -->
  <text x="56" y="72" fill="#4FC3F7" font-size="10" font-family="monospace" opacity="0.9">$</text>
  <text x="68" y="72" fill="#6C63FF" font-size="10" font-family="monospace" opacity="0.9">python3</text>
  <text x="118" y="72" fill="#ffffff" font-size="10" font-family="monospace" opacity="0.7">main.py</text>

  <!-- Line 2 -->
  <text x="56" y="90" fill="#A78BFA" font-size="10" font-family="monospace" opacity="0.9">import</text>
  <text x="102" y="90" fill="#4FC3F7" font-size="10" font-family="monospace" opacity="0.9">numpy</text>
  <text x="145" y="90" fill="#A78BFA" font-size="10" font-family="monospace" opacity="0.9">as</text>
  <text x="161" y="90" fill="#F59E0B" font-size="10" font-family="monospace" opacity="0.9">np</text>

  <!-- Line 3 -->
  <text x="56" y="108" fill="#4FC3F7" font-size="10" font-family="monospace" opacity="0.9">def</text>
  <text x="80" y="108" fill="#F59E0B" font-size="10" font-family="monospace" opacity="0.9">train</text>
  <text x="112" y="108" fill="#ffffff" font-size="10" font-family="monospace" opacity="0.7">(data, epochs=</text>
  <text x="218" y="108" fill="#A78BFA" font-size="10" font-family="monospace" opacity="0.9">100</text>
  <text x="234" y="108" fill="#ffffff" font-size="10" font-family="monospace" opacity="0.7">):</text>

  <!-- Line 4 indented -->
  <text x="70" y="126" fill="#A78BFA" font-size="10" font-family="monospace" opacity="0.9">return</text>
  <text x="116" y="126" fill="#4FC3F7" font-size="10" font-family="monospace" opacity="0.9">model</text>
  <text x="155" y="126" fill="#ffffff" font-size="10" font-family="monospace" opacity="0.7">.fit(data)</text>

  <!-- Line 5 output -->
  <text x="56" y="144" fill="#28C840" font-size="10" font-family="monospace" opacity="0.8">Accuracy: 97.3%</text>

  <!-- Blinking cursor -->
  <rect x="56" y="154" width="7" height="12" rx="1" fill="#6C63FF" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.1;0.9" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <text x="200" y="192" text-anchor="middle" fill="#6C63FF" font-size="11" font-family="sans-serif" font-weight="bold" opacity="0.9">PROGRAMMING</text>
</svg>
