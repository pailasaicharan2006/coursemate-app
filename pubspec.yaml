name: coursemate_app
description: CourseMate V2 - Personalized Course Discovery & Learning Platform
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.5.6

  # Navigation
  go_router: ^14.2.7

  # State Management
  flutter_riverpod: ^2.5.1

  # UI
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  fl_chart: ^0.68.0
  percent_indicator: ^4.2.3

  # Utils
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  timeago: ^3.6.1
  uuid: ^4.4.2
  equatable: ^2.0.5

  # Icons
  cupertino_icons: ^1.0.8
  file_picker: ^13.1.0
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/courses/
    - assets/icons/
    - assets/lottie/
    - assets/illustrations/
